spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: sms-backend

  # Runtime connection pool (HikariCP): restricted, non-superuser role. RLS is
  # enforced against this role. Never point this at a superuser account.
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Flyway runs as the elevated migration user (schema DDL + CREATE ROLE). This is
  # a separate connection from the runtime pool above and is the ONLY place a
  # privileged database account is used.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
    placeholders:
      app_user_name: ${DB_APP_USERNAME}
      app_user_password: ${DB_APP_PASSWORD}

  servlet:
    multipart:
      # Matches StudentDocumentService's own 10 MB cap -- kept in sync rather
      # than relying on Spring's 1 MB default, which would reject a valid
      # upload before the service's own (more informative) 400 ever runs.
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}

  # Free/self-hosted email (plan Phase 4.5 parts 14/16): plain SMTP, never a paid
  # provider. Defaults target a local dev SMTP catcher (e.g. MailHog on 1025,
  # no auth/TLS) so email "just works" locally with zero configuration; point
  # SMTP_HOST/PORT at any real SMTP relay (including a free one) in production.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
        connectiontimeout: 3000
        timeout: 3000
        writetimeout: 3000

server:
  # Deployment platforms (Railway, Heroku, Cloud Run) assign the listening port
  # at runtime through $PORT; the 8080 default keeps local runs unchanged.
  port: ${PORT:8080}

app:
  # Local/self-hosted file storage for uploaded student documents (plan Phase 3
  # section 2) -- never a paid cloud bucket. Outside any statically-served
  # directory; files are only ever read back through the authenticated
  # download endpoint (StudentDocumentService).
  storage:
    base-dir: ${STORAGE_BASE_DIR:./data/uploads}
  # DANGER: local-development convenience only. When true it exposes
  # /api/v1/dev/** endpoints (e.g. simulating a paid invoice without a real
  # Razorpay webhook). MUST stay false in every deployed environment -- real
  # payment confirmation only ever comes through the signature-verified webhook.
  # See DevToolsController and the README "Local demo without a webhook tunnel".
  dev-tools-enabled: ${APP_DEV_TOOLS_ENABLED:false}
  cors:
    # Origin patterns allowed to send credentialed (cookie) requests. Comma-separated.
    # Matched with Spring's allowedOriginPatterns, so "http://localhost:*" style
    # wildcards work. localhost and 127.0.0.1 are distinct origins to a browser --
    # list both for local dev (Vite prints both when bound to 0.0.0.0).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:access_token}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
      max-age-seconds: ${AUTH_COOKIE_MAX_AGE_SECONDS:3600}
  email:
    # The "from" address on outgoing mail, and a kill switch for environments with
    # no SMTP relay reachable at all -- when false, EmailGateway logs instead of
    # sending, so a missing/unreachable SMTP server can never fail a transaction
    # (plan part 16).
    from: ${EMAIL_FROM:no-reply@school.local}
    enabled: ${EMAIL_ENABLED:true}
  # Used to build links in outgoing email (portal activation, status lookup) --
  # the frontend origin, not this backend's own.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # Public-endpoint abuse protection (plan part 4/27): a simple in-memory
  # sliding-window limiter, no external service/dependency -- appropriate for a
  # single self-hosted instance. Applies to the public admission-application
  # submission endpoint.
  rate-limit:
    admission-submit:
      max-requests: ${ADMISSION_SUBMIT_RATE_LIMIT:5}
      window-minutes: ${ADMISSION_SUBMIT_RATE_WINDOW_MINUTES:15}

# Razorpay payment gateway (fee collection). Credentials come from the
# environment only -- never commit them (plan section 7.2d / 7.3). Test-mode
# keys are fine for development. `webhook-secret` is the separate secret set on
# the Razorpay dashboard webhook and is used only to verify inbound signatures.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: ${RAZORPAY_CURRENCY:INR}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # Email is designed to fail soft everywhere it's used (SmtpEmailGateway swallows every send
    # error so a down/unconfigured SMTP server -- e.g. no local MailHog running -- never breaks a
    # caller's transaction, plan Phase 4.5 part 16). The auto-registered MailHealthIndicator pings
    # the SMTP server and would otherwise flip the whole app's aggregate health to DOWN for the same
    # "SMTP unreachable" condition that's explicitly meant to be non-fatal -- so it's excluded here.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
